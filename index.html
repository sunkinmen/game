<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-orientations" content="landscape">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<title>臺北街頭槍戰</title>
<style>
/* 使用 dvh / svh 讓高度跟著 Safari 可視區（含分頁列收合）變化；
   -webkit-fill-available 作為舊 iOS 後備。body 固定在可視區內，避免被工具列往下擠。 */
html,body{
  margin:0;padding:0;width:100%;
  height:100%;height:-webkit-fill-available;height:100svh;height:100dvh;
  background:#07080c;overflow:hidden;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%
}
body{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;}
/* Phaser 產生的 canvas：強制鋪滿 body，避免 Safari 把實際繪製區算錯 */
body>canvas{display:block;position:absolute;left:0;top:0;touch-action:none;outline:none}
#rot{display:none;position:fixed;inset:0;z-index:99999;background:#07080c;color:#fff;font:700 22px/1.5 system-ui,-apple-system,sans-serif;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:12px;padding:24px;box-sizing:border-box}
#rot .phone{font-size:56px;line-height:1;animation:rot 1.5s ease-in-out infinite}
#boot-error{display:none;position:fixed;inset:0;z-index:100000;background:#07080c;color:#fff;padding:24px;box-sizing:border-box;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="rot"><div class="phone">📱↻</div><div>請將手機橫放</div><small>Turn your phone sideways to play</small></div>
<div id="boot-error"></div>
<!-- 載入順序：每個模組都放在 js/；sw.js 不作為普通 script 載入 -->
<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/touchui.js"></script>
<script src="js/combat.js"></script>
<script src="js/enemies.js"></script>
<script src="js/parallax.js"></script>
<script src="js/menu.js"></script>
<script src="js/stylize.js"></script>
<script src="js/worldart.js"></script>
<script src="js/hud.js"></script>
<script src="js/grade.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
